name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  ARARAT_BUILD_VERSION: ${{ github.run_number }}

jobs:
  assemble:
    # The macos-26 label and Xcode path are unverified until the first run.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo 'Select a release tag such as v1.2.3' >&2
            exit 1
          fi
      - name: Download pinned engine prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          engine_tag=$(engine/scripts/engine-key)
          test "$(gh release view "$engine_tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
          cd "$RUNNER_TEMP"
          gh release download "$engine_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern Chromium.zip --pattern Chromium.zip.sha256 --pattern provenance.json
          read -r expected filename < Chromium.zip.sha256
          actual=$(shasum -a 256 Chromium.zip | cut -d ' ' -f 1)
          if [[ "$actual" != "$expected" || "$filename" != Chromium.zip ]]; then
            echo 'Chromium.zip failed SHA-256 verification' >&2
            exit 1
          fi
          test -s provenance.json
          ditto -x -k Chromium.zip engine
          mv provenance.json engine/provenance.json
          rm Chromium.zip
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build Swift bindings
        run: nix develop ./nix --no-update-lock-file -c macos/scripts/build-core.sh
      - name: Assemble app
        run: |
          export ARARAT_CORRESPONDING_SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Ararat-source.tar.xz"
          swift build --package-path macos -c release
          engine="$RUNNER_TEMP/engine"
          stage="$RUNNER_TEMP/stage"
          macos/scripts/bundle-app.sh --from-artifact "$engine" "$stage"
          version=$(plutil -extract CFBundleShortVersionString raw -expect string -o - "$stage/Ararat.app/Contents/Info.plist")
          if [[ "$version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo 'The release tag must match the app marketing version' >&2
            exit 1
          fi
          ditto -c -k --keepParent "$stage/Ararat.app" "$RUNNER_TEMP/assembled.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assembled-app
          path: ${{ runner.temp }}/assembled.zip
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  sign:
    needs: assemble
    runs-on: macos-26
    timeout-minutes: 60
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assembled-app
          path: ${{ runner.temp }}
      - name: Prepare signing inputs
        run: |
          ditto -x -k "$RUNNER_TEMP/assembled.zip" "$RUNNER_TEMP/stage"
          rm "$RUNNER_TEMP/assembled.zip"
      - name: Sign the app and package release assets
        env:
          ARARAT_SIGNING_KEYCHAIN: ${{ runner.temp }}/ararat-signing/release.keychain-db
          ARARAT_RELEASE_ENTITLEMENTS: ${{ vars.ARARAT_RELEASE_ENTITLEMENTS }}
          ARARAT_PROVISIONING_PROFILE: ${{ vars.ARARAT_PROVISIONING_PROFILE }}
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          ARARAT_ED_PUBLIC_KEY: ${{ vars.ARARAT_ED_PUBLIC_KEY }}
          ARARAT_FEED_URL: ${{ vars.ARARAT_FEED_URL }}
        run: |
          umask 077
          creds="$RUNNER_TEMP/ararat-signing"
          keychain="$ARARAT_SIGNING_KEYCHAIN"
          mkdir "$creds"
          app="$RUNNER_TEMP/stage/Ararat.app"
          if [[ -n "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" > "$creds/sparkle.key"
            [[ "$ARARAT_FEED_URL" == https://?* ]] || { echo 'Set an HTTPS ARARAT_FEED_URL' >&2; exit 1; }
            source macos/scripts/configure-updates.sh
            validate_update_configuration
            configure_updates "$app/Contents/Info.plist" stable
          fi
          unset SPARKLE_ED_PRIVATE_KEY

          if [[ -n "$DEVELOPER_ID_P12" ]]; then
            password=$(openssl rand -hex 32)
            echo "::add-mask::$password"
            printf '%s' "${DEVELOPER_ID_P12:?}" | base64 --decode > "$creds/developer-id.p12"
            printf '%s\n' "${NOTARY_API_KEY:?}" > "$creds/notary.p8"
            printf '%s\n' "${ARARAT_RELEASE_ENTITLEMENTS:?}" > "$creds/entitlements.plist"
            before=$(security list-keychains -d user)
            printf 'User keychain search list before creation:\n%s\n' "$before"
            set --
            quoted_path='^[[:space:]]*"(.+)"[[:space:]]*$'
            while IFS= read -r entry; do
              [[ -z "$entry" ]] && continue
              [[ "$entry" =~ $quoted_path ]] || exit 1
              set -- "$@" "${BASH_REMATCH[1]}"
            done <<< "$before"
            # Creation can add the keychain to the search list before it holds any credentials.
            create_status=0
            security create-keychain -p "$password" "$keychain" || create_status=$?
            security list-keychains -d user -s "$@"
            after=$(security list-keychains -d user)
            printf 'User keychain search list after restoration:\n%s\n' "$after"
            [[ "$after" == "$before" && "$create_status" == 0 ]]
            security set-keychain-settings "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            security import "$creds/developer-id.p12" -k "$keychain" -f pkcs12 \
              -P "${DEVELOPER_ID_P12_PASSWORD:?}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
            rm "$creds/developer-id.p12"
            identity=$(security find-identity -v -p codesigning "$keychain" |
              sed -n 's/^[^"]*"\(Developer ID Application: [^"]*\)".*$/\1/p')
            if [[ -z "$identity" || "$identity" == *$'\n'* ]]; then
              echo 'Expected exactly one Developer ID Application identity' >&2
              exit 1
            fi
            notary_key_id="${NOTARY_API_KEY_ID:?}"
            notary_issuer="${NOTARY_API_ISSUER:?}"
            unset DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER
            if [[ -n "$ARARAT_PROVISIONING_PROFILE" ]]; then
              printf '%s' "$ARARAT_PROVISIONING_PROFILE" | base64 --decode > "$app/Contents/embedded.provisionprofile"
            fi
            macos/scripts/sign-release.sh --identity "$identity" --entitlements "$creds/entitlements.plist" "$app"
            macos/scripts/notarize.sh --key "$creds/notary.p8" --key-id "$notary_key_id" \
              --issuer "$notary_issuer" "$app"
            rm "$creds/notary.p8"
          else
            if [[ -n "$DEVELOPER_ID_P12_PASSWORD" || -n "$NOTARY_API_KEY" || -n "$NOTARY_API_KEY_ID" || -n "$NOTARY_API_ISSUER" ]]; then
              echo 'DEVELOPER_ID_P12 is required when DEVELOPER_ID_P12_PASSWORD, NOTARY_API_KEY, NOTARY_API_KEY_ID or NOTARY_API_ISSUER is configured' >&2
              exit 1
            fi
            macos/scripts/sign-release.sh --identity - "$app"
          fi

          out="$RUNNER_TEMP/signed"
          mkdir "$out"
          ditto -c -k --keepParent "$app" "$out/Ararat.zip"
          if [[ -s "$creds/sparkle.key" ]]; then
            swift package --package-path macos resolve
            export ARARAT_DOWNLOAD_URL_PREFIX="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
            macos/scripts/make-appcast.sh --key-file "$creds/sparkle.key" stable "$ARARAT_BUILD_VERSION" "$out"
            test -s "$out/appcast.xml"
          fi
      - name: Delete temporary signing credentials
        if: always()
        run: |
          creds="$RUNNER_TEMP/ararat-signing"
          status=0
          if [[ -f "$creds/release.keychain-db" ]]; then
            security delete-keychain "$creds/release.keychain-db" || status=$?
          fi
          rm -rf -- "$creds"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          path: |
            ${{ runner.temp }}/signed/Ararat.zip
            ${{ runner.temp }}/signed/appcast.xml
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  publish:
    needs: sign
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: ${{ runner.temp }}/release
      - name: Generate and attach Corresponding Source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          engine/scripts/corresponding-source "$RUNNER_TEMP/Ararat-source"
          cd "$RUNNER_TEMP"
          test -s release/Ararat.zip
          assets=(release/Ararat.zip Ararat-source.tar.xz Ararat-source.tar.xz.sha256)
          if [[ -s release/appcast.xml ]]; then
            assets+=(release/appcast.xml)
          fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag --generate-notes
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft and .isPrerelease')" = true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "${assets[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --draft=false
