name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    # Hosted runners stop at macOS 26 and Xcode 26.6 (image 20261117); local builds use Xcode 27.2.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check action pins
        run: |
          .github/scripts/test-check-pins.sh
          uv run --no-project python .github/scripts/check-pins.py
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Test Rust
        run: nix develop ./nix --no-update-lock-file -c cargo test --locked --manifest-path core/Cargo.toml -p ararat-core -p ararat-ffi
      - name: Build Swift bindings
        run: nix develop ./nix --no-update-lock-file -c macos/scripts/build-core.sh
      - name: Test Swift
        working-directory: macos
        run: swift test --no-parallel --filter 'PromptFixtureTests|AraratUITests'
