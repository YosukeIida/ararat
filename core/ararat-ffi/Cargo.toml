[package]
name = "ararat-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
ararat-core = { path = "../ararat-core" }
uniffi = { version = "0.32", features = ["cli"] }

[dev-dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
